
name: Build SEA NAV GPS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Inspect AndroidManifest
        run: |
          echo "=== MANIFEST CONTENT ==="
          nl -ba app/src/main/AndroidManifest.xml

          echo "=== FILE TYPE ==="
          file app/src/main/AndroidManifest.xml

          echo "=== FIRST 32 BYTES ==="
          od -An -tx1 -N32 app/src/main/AndroidManifest.xml

      - name: Build APK
        run: gradle assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SEA-NAV-GPS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
