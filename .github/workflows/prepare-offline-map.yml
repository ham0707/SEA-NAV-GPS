
name: Prepare SEA NAV Offline Map

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Java Shortbread MBTiles
        run: |
          curl -L --fail --retry 3 \
            -o java-shortbread.mbtiles \
            https://download.geofabrik.de/asia/indonesia/java-shortbread-1.0.mbtiles

          ls -lh java-shortbread.mbtiles

      - name: Convert MBTiles to PMTiles
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            protomaps/go-pmtiles \
            convert /data/java-shortbread.mbtiles \
            /data/java-shortbread.pmtiles

      - name: Extract Java Sea region
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            protomaps/go-pmtiles \
            extract /data/java-shortbread.pmtiles \
            /data/sea-nav-laut-jawa.pmtiles \
            --bbox=105,-8,115,-3.5

      - name: Verify map package
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            protomaps/go-pmtiles \
            verify /data/sea-nav-laut-jawa.pmtiles

          ls -lh sea-nav-laut-jawa.pmtiles

      - name: Upload offline map
        uses: actions/upload-artifact@v4
        with:
          name: SEA-NAV-LAUT-JAWA-PMTILES
          path: sea-nav-laut-jawa.pmtiles
          compression-level: 0
          retention-days: 7
